<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Outer chip border circuit grid -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="16 8" />
  
  <!-- IC Die Core -->
  <rect x="136" y="136" width="240" height="240" rx="24" fill="#0b1120" stroke="url(#cyan-grad)" stroke-width="8" filter="url(#glow)" />

  <!-- IC Pins (Top) -->
  <g fill="url(#gold-grad)">
    <rect x="176" y="44" width="16" height="40" rx="4" />
    <rect x="216" y="44" width="16" height="40" rx="4" />
    <rect x="256" y="44" width="16" height="40" rx="4" />
    <rect x="280" y="44" width="16" height="40" rx="4" />
    <rect x="320" y="44" width="16" height="40" rx="4" />
  </g>
  <!-- IC Pins (Bottom) -->
  <g fill="url(#gold-grad)">
    <rect x="176" y="428" width="16" height="40" rx="4" />
    <rect x="216" y="428" width="16" height="40" rx="4" />
    <rect x="256" y="428" width="16" height="40" rx="4" />
    <rect x="280" y="428" width="16" height="40" rx="4" />
    <rect x="320" y="428" width="16" height="40" rx="4" />
  </g>
  <!-- IC Pins (Left) -->
  <g fill="url(#gold-grad)">
    <rect x="44" y="176" width="40" height="16" rx="4" />
    <rect x="44" y="216" width="40" height="16" rx="4" />
    <rect x="44" y="256" width="40" height="16" rx="4" />
    <rect x="44" y="280" width="40" height="16" rx="4" />
    <rect x="44" y="320" width="40" height="16" rx="4" />
  </g>
  <!-- IC Pins (Right) -->
  <g fill="url(#gold-grad)">
    <rect x="428" y="176" width="40" height="16" rx="4" />
    <rect x="428" y="216" width="40" height="16" rx="4" />
    <rect x="428" y="256" width="40" height="16" rx="4" />
    <rect x="428" y="280" width="40" height="16" rx="4" />
    <rect x="428" y="320" width="40" height="16" rx="4" />
  </g>

  <!-- Trace Lines -->
  <path d="M 184 84 L 184 136 M 224 84 L 224 136 M 264 84 L 264 136 M 288 84 L 288 136 M 328 84 L 328 136" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M 184 428 L 184 376 M 224 428 L 224 376 M 264 428 L 264 376 M 288 428 L 288 376 M 328 428 L 328 376" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M 84 184 L 136 184 M 84 224 L 136 224 M 84 264 L 136 264 M 84 288 L 136 288 M 84 328 L 136 328" stroke="#475569" stroke-width="4" stroke-linecap="round" />
  <path d="M 428 184 L 376 184 M 428 224 L 376 224 M 428 264 L 376 264 M 428 288 L 376 288 M 428 328 L 376 328" stroke="#475569" stroke-width="4" stroke-linecap="round" />

  <!-- Core Silicon Wafer Symbol / RISC-V & Logic Gate Accent -->
  <g transform="translate(256, 256)">
    <!-- Central CPU / Silicon Logo -->
    <rect x="-60" y="-60" width="120" height="120" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="5" />
    
    <!-- Micro-architectural Core Quadrants -->
    <rect x="-48" y="-48" width="40" height="40" rx="6" fill="#0284c7" opacity="0.8" />
    <rect x="8" y="-48" width="40" height="40" rx="6" fill="#f59e0b" opacity="0.8" />
    <rect x="-48" y="8" width="40" height="40" rx="6" fill="#10b981" opacity="0.8" />
    <rect x="8" y="8" width="40" height="40" rx="6" fill="#8b5cf6" opacity="0.8" />
    
    <!-- Center glowing bus node -->
    <circle cx="0" cy="0" r="12" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>
